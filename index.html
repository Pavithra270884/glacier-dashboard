<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Glacier Risk Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 1000px; margin: 60px auto; }
    .grid { display: flex; gap: 24px; flex-wrap: wrap; }
    .card { border-radius: 10px; padding: 24px; color: white; flex: 1; min-width: 320px; }
    .low { background: #2e8b57; } .medium { background: #d99a1b; } .high { background: #c0392b; }
  </style>
</head>
<body>
  <h1>Glacier GLOF Risk Dashboard</h1>
  <div class="grid" id="cards">Loading...</div>
  <script>
    const sites = ["samudra_tapu", "sutri_dhaka"];
    const container = document.getElementById('cards');
    container.innerHTML = "";

    sites.forEach(site => {
      fetch(`https://glacierphase1data.blob.core.windows.net/glacier-data/risk_scores_${site}.json`)
        .then(r => r.json())
        .then(d => {
          const card = document.createElement('div');
          card.className = `card ${d.risk_band}`;
          card.innerHTML = `
            <h2>${d.site_name}</h2>
            <h3>Risk band: ${d.risk_band.toUpperCase()}</h3>
            <p>Score: ${d.risk_score} / 100</p>
            <p>Latest temperature: ${d.latest_temp_c}&deg;C</p>
            <p>Latest rainfall: ${d.latest_rain_mm} mm</p>
            <p style="margin-top:12px; font-style:italic;">${d.alert_text}</p>
          `;
          container.appendChild(card);
        })
        .catch(() => {
          const card = document.createElement('div');
          card.innerText = `No data yet for ${site}`;
          container.appendChild(card);
        });
    });
  </script>
</body>
</html>
